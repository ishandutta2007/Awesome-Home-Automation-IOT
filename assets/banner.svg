<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .orbit-circle { fill: none; stroke: rgba(56, 189, 248, 0.15); stroke-dasharray: 4 6; }
      
      /* Subtle SVG Keyframe Animations for modern aesthetic */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }

      .pulse-beacon {
        animation: pulseGlow 4s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
      .circuit-line {
        stroke: url(#textGrad);
        stroke-width: 1.5;
        stroke-dasharray: 8 12;
        animation: dashMove 12s linear infinite;
        opacity: 0.45;
      }
      .badge-bg {
        fill: #1e293b;
        stroke: rgba(148, 163, 184, 0.2);
        stroke-width: 1;
        rx: 16;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Background -->
  <g class="bg-grid">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M120 0 V340 M240 0 V340 M360 0 V340 M480 0 V340 M600 0 V340 M720 0 V340 M840 0 V340 M960 0 V340 M1080 0 V340" />
  </g>

  <!-- Dynamic Animated Ambient Glow Spheres (Kept in Background behind text) -->
  <circle cx="150" cy="90" r="130" fill="url(#glowGrad)" class="pulse-beacon" />
  <circle cx="1050" cy="220" r="160" fill="url(#glowGrad)" class="pulse-beacon" />

  <!-- Animated Circuit Flow Lines -->
  <path class="circuit-line" d="M50 280 L200 280 L260 220 L400 220" />
  <path class="circuit-line" d="M800 100 L950 100 L1020 160 L1150 160" />

  <!-- Floating Ambient Nodes -->
  <g class="particle-1">
    <circle cx="180" cy="190" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="180" cy="190" r="12" fill="#38bdf8" opacity="0.2" />
  </g>
  <g class="particle-2">
    <circle cx="1020" cy="110" r="5" fill="#c084fc" opacity="0.8" />
    <circle cx="1020" cy="110" r="16" fill="#c084fc" opacity="0.2" />
  </g>
  <g class="particle-3">
    <circle cx="920" cy="260" r="4" fill="#818cf8" opacity="0.7" />
  </g>

  <!-- Foreground Title and Content -->
  <!-- Top Category Chip -->
  <g transform="translate(450, 42)">
    <rect class="badge-bg" width="300" height="32" x="0" y="0" rx="16" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="35" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SMART HOME &amp; IOT ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Home Automation &amp; IoT
  </text>

  <!-- Subtitle -->
  <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="url(#subGrad)">
    Curated Hub for Local-First Automations, Open Source Stacks &amp; Enterprise IoT Platforms
  </text>

  <!-- Protocol Feature Badges in Foreground -->
  <g transform="translate(600, 246)">
    <!-- Matter / Thread -->
    <g transform="translate(-320, 0)">
      <rect class="badge-bg" width="145" height="36" x="0" y="0" rx="8" />
      <text x="72" y="23" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">⚡ Matter / Thread</text>
    </g>
    <!-- Zigbee & Z-Wave -->
    <g transform="translate(-160, 0)">
      <rect class="badge-bg" width="145" height="36" x="0" y="0" rx="8" />
      <text x="72" y="23" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600">📡 Zigbee &amp; Z-Wave</text>
    </g>
    <!-- MQTT & Local Control -->
    <g transform="translate(0, 0)">
      <rect class="badge-bg" width="155" height="36" x="0" y="0" rx="8" />
      <text x="77" y="23" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">🔒 MQTT &amp; Local I/O</text>
    </g>
    <!-- Open Source Firmware -->
    <g transform="translate(170, 0)">
      <rect class="badge-bg" width="155" height="36" x="0" y="0" rx="8" />
      <text x="77" y="23" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="600">🛠️ ESPHome &amp; Tasmota</text>
    </g>
  </g>
</svg>
